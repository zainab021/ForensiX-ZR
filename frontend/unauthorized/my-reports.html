<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Reports | ForensiX ZR Unit</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="public-body">
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-icon"><i class="fa-solid fa-fingerprint"></i></div>
          <div>
            <h2>ForensiX</h2>
            <span>ZR Unit • Secure Crime Analysis</span>
          </div>
        </div>
        <div class="nav-title">Public Safety</div>
        <a class="nav-link" href="dashboard.html"
          ><i class="fa-solid fa-house"></i>Dashboard</a
        ><a class="nav-link" href="report.html"
          ><i class="fa-solid fa-flag"></i>Report</a
        ><a class="nav-link" href="find-help.html"
          ><i class="fa-solid fa-hand-holding-medical"></i>Find Help</a
        ><a class="nav-link" href="tip-details.html"
          ><i class="fa-solid fa-lightbulb"></i>Tips</a
        ><a class="nav-link" href="emergency-sos.html"
          ><i class="fa-solid fa-triangle-exclamation"></i>SOS</a
        ><a class="nav-link" href="my-reports.html"
          ><i class="fa-solid fa-clipboard-list"></i>My Reports</a
        ><a class="nav-link" href="alerts.html"
          ><i class="fa-solid fa-bell"></i>Alerts</a
        ><a class="nav-link" href="community-safety.html"
          ><i class="fa-solid fa-people-group"></i>Community Safety</a
        ><a class="nav-link" href="contact-us.html"
          ><i class="fa-solid fa-envelope"></i>Contact</a
        ><a class="nav-link" href="profile.html"
          ><i class="fa-solid fa-user"></i>Profile</a
        ><a class="nav-link" href="../index.html"
          ><i class="fa-solid fa-right-from-bracket"></i>Logout</a
        >
      </aside>
      <main class="main">
        <div class="topbar">
          <div>
            <button class="btn btn-soft mobile-menu">
              <i class="fa-solid fa-bars"></i>
            </button>
            <div class="page-kicker">citizen portal</div>
            <h1 class="page-title">My Reports</h1>
            <p class="page-subtitle">
              Track your submitted public reports and their safe status updates.
            </p>
          </div>
          <div class="top-actions">
            <button class="btn btn-soft">
              <i class="fa-solid fa-magnifying-glass"></i></button
            ><button class="btn btn-soft">
              <i class="fa-solid fa-bell"></i>
            </button>
            <div class="avatar">ZR</div>
          </div>
        </div>
        <section class="card">
          <div class="section-head">
            <h2 class="section-title">Submitted Reports</h2>
            <div class="toolbar">
              <input
                class="search-box"
                data-filter-table="#mainTable"
                placeholder="Search records..."
              /><select class="filter-select">
                <option>All Status</option>
                <option>Received</option>
                <option>Under Review</option>
                <option>Resolved</option>
              </select>
            </div>
          </div>
          <div class="table-wrap">
            <table id="mainTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Title</th>
                  <th>Type</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="myReportsTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/assistant-widget.js"></script>
  </body>
</html>
