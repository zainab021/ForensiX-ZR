version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: forensix_db
    environment:
      POSTGRES_USER: forensix
      POSTGRES_PASSWORD: forensix
      POSTGRES_DB: forensix_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forensix"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./forensix_backend_python
    container_name: forensix_backend
    ports:
      - "8000:8000"
    env_file:
      - ./forensix_backend_python/.env
    environment:
      DATABASE_URL: postgresql://forensix:forensix@db:5432/forensix_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: forensix_frontend
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads_data:
  postgres_data:
